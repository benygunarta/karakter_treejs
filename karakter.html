<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Karakter Dokter 3D - Jalur Berkelok & Multi Titik</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* UI Header Company Profile */
        .ui-header {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            pointer-events: none;
        }
        .ui-header h1 { margin: 0; font-size: 1.6rem; color: #0284c7; letter-spacing: 1px; }
        .ui-header p { margin: 0.25rem 0 0 0; color: #64748b; font-size: 0.9rem; }

        /* Container Kontrol Bawah */
        .controls-wrapper {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: max-content;
            max-width: 95vw;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 18px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            backdrop-filter: blur(8px);
        }

        .panel-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 1px;
            background: #f1f5f9;
            padding: 3px 12px;
            border-radius: 20px;
        }

        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #f1f5f9;
            color: #334155;
        }
        .btn:hover { background-color: #bae6fd; color: #0369a1; }

        .btn.active-anim {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.35);
        }

        .btn.active-point {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.35);
        }
    </style>

    <!-- Import Map untuk Three.js dan RoundedBoxGeometry -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div class="ui-header">
        <h1>MEDICA HEALTHCARE</h1>
        <p>Eksplorasi Jalur Berkelok Antar Titik Zona Studio</p>
    </div>

    <!-- Panel Tombol Kontrol -->
    <div class="controls-wrapper">
        <span class="panel-label">Navigasi Titik Lokasi</span>
        <div class="control-panel">
            <button class="btn active-point" id="pt-A">Titik A (Zona 1)</button>
            <button class="btn" id="pt-B">Titik B (Zona 2)</button>
            <button class="btn" id="pt-C">Titik C (Zona 3)</button>
            <button class="btn" id="pt-D">Titik D (Zona 4)</button>
        </div>

        <span class="panel-label">Aksi & Animasi Dokter</span>
        <div class="control-panel">
            <button class="btn active-anim" id="btn-idle">Idle (Siaga)</button>
            <button class="btn" id="btn-wave">Menyapa</button>
            <button class="btn" id="btn-walk">Jalan di Tempat</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/examples/jsm/geometries/RoundedBoxGeometry.js';

        // ==========================================
        // [1. INISIALISASI SCENE, KAMERA, RENDERER]
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.FogExp2(0xffffff, 0.02);

        // Kamera dizoom-out lebih jauh dari sebelumnya (jarak Y dan Z diperbesar)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // [2. PENCAHAYAAN & LAPANGAN POLOS]
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 12, 8);
        scene.add(dirLight);

        const rimLight = new THREE.PointLight(0x0ea5e9, 1.0, 15);
        rimLight.position.set(-4, 5, -4);
        scene.add(rimLight);

        const FLOOR_Y = -0.82;

        // Memperluas bidang lantai lapangan/studio
        const floorGeo = new THREE.PlaneGeometry(35, 35);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0xf8fafc,
            roughness: 0.9,
            metalness: 0.05
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = FLOOR_Y - 0.01;
        scene.add(floor);

        // ==========================================
        // [3. DEFINISI TITIK & JALUR BERKELOK (CURVE)]
        // ==========================================
        // Jarak antar titik dibuat lebih jauh
        const waypoints = {
            'A': new THREE.Vector3(-4.5, 0,  3.2),
            'B': new THREE.Vector3( 4.5, 0,  3.2),
            'C': new THREE.Vector3( 4.5, 0, -3.2),
            'D': new THREE.Vector3(-4.5, 0, -3.2)
        };

        const pointKeysArray = ['A', 'B', 'C', 'D'];

        // Visualisasi Marker pada setiap Titik
        const markerMeshes = {};
        Object.entries(waypoints).forEach(([key, pos]) => {
            const ringGeo = new THREE.RingGeometry(0.35, 0.45, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: key === 'A' ? 0x10b981 : 0x0284c7,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(pos.x, FLOOR_Y + 0.01, pos.z);
            scene.add(ring);

            const dotGeo = new THREE.CircleGeometry(0.18, 24);
            const dotMat = new THREE.MeshBasicMaterial({
                color: key === 'A' ? 0x10b981 : 0xe0f2fe,
                side: THREE.DoubleSide
            });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.rotation.x = -Math.PI / 2;
            dot.position.set(pos.x, FLOOR_Y + 0.015, pos.z);
            scene.add(dot);

            markerMeshes[key] = { ringMat, dotMat };
        });

        // Membuat Jalur Berkelok Menggunakan CatmullRomCurve3 (A -> B -> C -> D -> A)
        const curvePoints = [
            waypoints['A'],
            new THREE.Vector3(0, 0, 4.2),  // titik kontrol kelokan atas
            waypoints['B'],
            new THREE.Vector3(5.5, 0, 0),  // titik kontrol kelokan kanan
            waypoints['C'],
            new THREE.Vector3(0, 0, -4.2), // titik kontrol kelokan bawah
            waypoints['D'],
            new THREE.Vector3(-5.5, 0, 0), // titik kontrol kelokan kiri
            waypoints['A']
        ];

        const studioCurve = new THREE.CatmullRomCurve3(curvePoints, true, 'catmullrom', 0.5);

        // Render garis lintasan melingkar berkelok di lantai
        const sampledPoints = studioCurve.getPoints(200);
        const raisedPoints = sampledPoints.map(p => new THREE.Vector3(p.x, FLOOR_Y + 0.02, p.z));
        const pathGeometry = new THREE.BufferGeometry().setFromPoints(raisedPoints);
        const pathMaterial = new THREE.LineDashedMaterial({
            color: 0x94a3b8,
            dashSize: 0.3,
            gapSize: 0.15,
            linewidth: 2
        });
        const pathLine = new THREE.Line(pathGeometry, pathMaterial);
        pathLine.computeLineDistances();
        scene.add(pathLine);

        // ==========================================
        // [4. MATERIAL & KARAKTER DOKTER]
        // ==========================================
        const skinMat   = new THREE.MeshStandardMaterial({ color: 0xfcd3a1, roughness: 0.45 });
        const hairMat   = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
        const coatMat   = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
        const scrubMat  = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.5 });
        const jointMat  = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3 });
        const metalMat  = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });
        const eyeMat    = new THREE.MeshBasicMaterial({ color: 0x0f172a });

        const doctor = new THREE.Group();
        doctor.position.copy(waypoints['A']);

        // Kepala & Rambut
        const headGroup = new THREE.Group();
        headGroup.position.y = 1.42;

        const neckJoint = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 24), skinMat);
        neckJoint.position.y = -0.26;
        headGroup.add(neckJoint);

        const head = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.62, 0.62, 4, 0.15), skinMat);
        headGroup.add(head);

        const hairTop = new THREE.Mesh(new RoundedBoxGeometry(0.66, 0.24, 0.66, 4, 0.1), hairMat);
        hairTop.position.set(0, 0.24, -0.01);
        headGroup.add(hairTop);

        const hairBack = new THREE.Mesh(new RoundedBoxGeometry(0.65, 0.45, 0.22, 4, 0.08), hairMat);
        hairBack.position.set(0, 0.06, -0.23);
        headGroup.add(hairBack);

        const hairBang = new THREE.Mesh(new RoundedBoxGeometry(0.22, 0.14, 0.2, 3, 0.05), hairMat);
        hairBang.position.set(0.16, 0.2, 0.26);
        hairBang.rotation.z = -0.15;
        headGroup.add(hairBang);

        const eyeGeo = new THREE.SphereGeometry(0.035, 16, 16);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.13, 0.02, 0.31);
        headGroup.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.13, 0.02, 0.31);
        headGroup.add(rightEye);

        doctor.add(headGroup);

        // Badan & Jas
        const bodyGroup = new THREE.Group();
        const innerTorso = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.78, 0.38, 4, 0.1), scrubMat);
        innerTorso.position.y = 0.62;
        bodyGroup.add(innerTorso);

        const coatSideGeo = new RoundedBoxGeometry(0.26, 0.84, 0.42, 4, 0.08);
        const leftCoat = new THREE.Mesh(coatSideGeo, coatMat);
        leftCoat.position.set(-0.21, 0.6, 0.01);
        bodyGroup.add(leftCoat);

        const rightCoat = new THREE.Mesh(coatSideGeo, coatMat);
        rightCoat.position.set(0.21, 0.6, 0.01);
        bodyGroup.add(rightCoat);

        const coatBack = new THREE.Mesh(new RoundedBoxGeometry(0.68, 0.84, 0.22, 4, 0.08), coatMat);
        coatBack.position.set(0, 0.6, -0.11);
        bodyGroup.add(coatBack);

        const stethoNeck = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.02, 12, 24, Math.PI * 1.35), jointMat);
        stethoNeck.rotation.x = Math.PI / 2.2;
        stethoNeck.rotation.z = -Math.PI * 0.67;
        stethoNeck.position.set(0, 1.03, 0.03);
        bodyGroup.add(stethoNeck);

        const stethoHead = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.02, 16), metalMat);
        stethoHead.rotation.x = Math.PI / 2;
        stethoHead.position.set(0.18, 0.75, 0.22);
        bodyGroup.add(stethoHead);

        doctor.add(bodyGroup);

        // Lengan
        function createArm(isLeft) {
            const side = isLeft ? -1 : 1;
            const shoulderPivot = new THREE.Group();
            shoulderPivot.position.set(side * 0.43, 0.94, 0);

            shoulderPivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 24), coatMat));
            const upperArm = new THREE.Mesh(new RoundedBoxGeometry(0.2, 0.38, 0.22, 3, 0.06), coatMat);
            upperArm.position.y = -0.19;
            shoulderPivot.add(upperArm);

            const elbowPivot = new THREE.Group();
            elbowPivot.position.y = -0.38;

            elbowPivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.095, 24, 24), coatMat));
            const lowerArm = new THREE.Mesh(new RoundedBoxGeometry(0.18, 0.36, 0.2, 3, 0.05), coatMat);
            lowerArm.position.y = -0.18;
            elbowPivot.add(lowerArm);

            const handBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 20, 20), skinMat);
            handBall.position.y = -0.38;
            elbowPivot.add(handBall);

            shoulderPivot.add(elbowPivot);
            return { shoulderPivot, elbowPivot };
        }

        const leftArm = createArm(true);
        const rightArm = createArm(false);

        const clipboard = new THREE.Mesh(new RoundedBoxGeometry(0.26, 0.34, 0.025, 2, 0.01), jointMat);
        clipboard.position.set(0.04, -0.4, 0.1);
        clipboard.rotation.x = Math.PI / 2.2;
        leftArm.elbowPivot.add(clipboard);

        const paper = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.29, 0.03), coatMat);
        paper.position.copy(clipboard.position);
        paper.rotation.copy(clipboard.rotation);
        leftArm.elbowPivot.add(paper);

        doctor.add(leftArm.shoulderPivot);
        doctor.add(rightArm.shoulderPivot);

        // Kaki
        function createLeg(isLeft) {
            const side = isLeft ? -1 : 1;
            const hipPivot = new THREE.Group();
            hipPivot.position.set(side * 0.16, 0.24, 0);

            hipPivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.125, 24, 24), scrubMat));
            const thigh = new THREE.Mesh(new RoundedBoxGeometry(0.24, 0.44, 0.26, 3, 0.06), scrubMat);
            thigh.position.y = -0.22;
            hipPivot.add(thigh);

            const kneePivot = new THREE.Group();
            kneePivot.position.y = -0.44;

            kneePivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 24), scrubMat));
            const shin = new THREE.Mesh(new RoundedBoxGeometry(0.22, 0.44, 0.24, 3, 0.06), scrubMat);
            shin.position.y = -0.22;
            kneePivot.add(shin);

            const shoe = new THREE.Mesh(new RoundedBoxGeometry(0.24, 0.14, 0.34, 3, 0.05), jointMat);
            shoe.position.set(0, -0.46, 0.05);
            kneePivot.add(shoe);

            hipPivot.add(kneePivot);
            return { hipPivot, kneePivot };
        }

        const leftLeg = createLeg(true);
        const rightLeg = createLeg(false);
        doctor.add(leftLeg.hipPivot);
        doctor.add(rightLeg.hipPivot);

        scene.add(doctor);

        // Posisi Kamera di-zoom out lebih jauh
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0.2, 0);

        // ==========================================
        // [5. LOGIKA NAVIGASI SEKUENSIAL & KURVA]
        // ==========================================
        let currentAnim = 'idle';
        let currentWaypointKey = 'A';
        let targetWaypointKey = 'A';
        let isMoving = false;

        let pathProgress = 0; // Nilai 0.0 sampai 1.0 pada kurva
        let startProgress = 0;
        let endProgress = 0;
        let moveDuration = 3.5; // Durasi perjalanan
        let moveTimer = 0;

        const ptButtons = {
            'A': document.getElementById('pt-A'),
            'B': document.getElementById('pt-B'),
            'C': document.getElementById('pt-C'),
            'D': document.getElementById('pt-D')
        };

        const animButtons = {
            idle: document.getElementById('btn-idle'),
            wave: document.getElementById('btn-wave'),
            walk: document.getElementById('btn-walk')
        };

        function updateAnimButtonsUI(activeKey) {
            Object.entries(animButtons).forEach(([key, btn]) => {
                btn.classList.toggle('active-anim', key === activeKey);
            });
        }

        // Cari t terdekat (0..1) untuk sebuah Vector3 pada kurva
        function getCurveParamForPoint(targetVec) {
            let bestT = 0;
            let minDist = Infinity;
            const samples = 300;
            for (let i = 0; i <= samples; i++) {
                const t = i / samples;
                const pt = studioCurve.getPoint(t);
                const dist = pt.distanceTo(targetVec);
                if (dist < minDist) {
                    minDist = dist;
                    bestT = t;
                }
            }
            return bestT;
        }

        // Pemetaan Key ke nilai parameter t kurva
        const waypointParams = {
            'A': getCurveParamForPoint(waypoints['A']),
            'B': getCurveParamForPoint(waypoints['B']),
            'C': getCurveParamForPoint(waypoints['C']),
            'D': getCurveParamForPoint(waypoints['D'])
        };

        function goToWaypoint(pointKey) {
            if (pointKey === targetWaypointKey && isMoving) return;

            targetWaypointKey = pointKey;
            startProgress = pathProgress;
            endProgress = waypointParams[pointKey];

            // Menentukan arah gerak searah kurva tertutup (0 -> 1)
            if (endProgress < startProgress && (startProgress - endProgress > 0.5)) {
                endProgress += 1.0; // Lewat titik putar awal kurva
            } else if (endProgress > startProgress && (endProgress - startProgress > 0.5)) {
                // Lewat ke arah sebaliknya jika lebih dekat
            }

            moveTimer = 0;
            isMoving = true;

            // Update UI Tombol Titik
            Object.entries(ptButtons).forEach(([key, btn]) => {
                btn.classList.toggle('active-point', key === pointKey);
            });

            // Update Warna Marker
            Object.entries(markerMeshes).forEach(([key, mats]) => {
                mats.ringMat.color.setHex(key === pointKey ? 0x10b981 : 0x0284c7);
                mats.dotMat.color.setHex(key === pointKey ? 0x10b981 : 0xe0f2fe);
            });

            currentAnim = 'walk';
            updateAnimButtonsUI('walk');
        }

        // Event listener tombol titik
        Object.keys(ptButtons).forEach(key => {
            ptButtons[key].addEventListener('click', () => goToWaypoint(key));
        });

        animButtons.idle.addEventListener('click', () => { if (!isMoving) { currentAnim = 'idle'; updateAnimButtonsUI('idle'); } });
        animButtons.wave.addEventListener('click', () => { if (!isMoving) { currentAnim = 'wave'; updateAnimButtonsUI('wave'); } });
        animButtons.walk.addEventListener('click', () => { if (!isMoving) { currentAnim = 'walk'; updateAnimButtonsUI('walk'); } });

        function smoothReset(obj, targetX, targetY, targetZ, factor = 0.12) {
            obj.rotation.x = THREE.MathUtils.lerp(obj.rotation.x, targetX, factor);
            obj.rotation.y = THREE.MathUtils.lerp(obj.rotation.y, targetY, factor);
            obj.rotation.z = THREE.MathUtils.lerp(obj.rotation.z, targetZ, factor);
        }

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a + diff * t;
        }

        // ==========================================
        // [6. RENDER & ANIMATION LOOP]
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const t = clock.getElapsedTime();

            if (isMoving) {
                moveTimer += delta;
                let progressFactor = Math.min(moveTimer / moveDuration, 1.0);

                // Gunakan easing agar gerakan mulai dan berhenti dengan halus
                const easedFactor = progressFactor < 0.5
                    ? 2 * progressFactor * progressFactor
                    : 1 - Math.pow(-2 * progressFactor + 2, 2) / 2;

                let currentT = startProgress + (endProgress - startProgress) * easedFactor;
                let sampleT = currentT % 1.0;
                if (sampleT < 0) sampleT += 1.0;

                pathProgress = sampleT;

                const currentPos = studioCurve.getPoint(pathProgress);
                const nextPos = studioCurve.getPoint((pathProgress + 0.01) % 1.0);

                doctor.position.set(currentPos.x, currentPos.y, currentPos.z);

                const dx = nextPos.x - currentPos.x;
                const dz = nextPos.z - currentPos.z;
                const targetAngle = Math.atan2(dx, dz);
                doctor.rotation.y = lerpAngle(doctor.rotation.y, targetAngle, 0.2);

                if (progressFactor >= 1.0) {
                    isMoving = false;
                    currentWaypointKey = targetWaypointKey;
                    currentAnim = 'idle';
                    updateAnimButtonsUI('idle');
                }
            } else {
                doctor.rotation.y = lerpAngle(doctor.rotation.y, 0, 0.08);
            }

            // Pengaturan Animasi Karakter
            if (currentAnim === 'idle') {
                doctor.position.y = THREE.MathUtils.lerp(doctor.position.y, Math.sin(t * 2) * 0.015, 0.1);
                smoothReset(headGroup, Math.sin(t * 2) * 0.03, Math.sin(t * 1) * 0.1, 0);

                smoothReset(leftArm.shoulderPivot, -0.2, 0, -0.1);
                smoothReset(leftArm.elbowPivot, -1.1, 0, 0);
                smoothReset(rightArm.shoulderPivot, 0, 0, 0.1 + Math.sin(t * 2) * 0.02);
                smoothReset(rightArm.elbowPivot, -0.2, 0, 0);

                smoothReset(leftLeg.hipPivot, 0, 0, 0);
                smoothReset(leftLeg.kneePivot, 0, 0, 0);
                smoothReset(rightLeg.hipPivot, 0, 0, 0);
                smoothReset(rightLeg.kneePivot, 0, 0, 0);

            } else if (currentAnim === 'wave') {
                doctor.position.y = THREE.MathUtils.lerp(doctor.position.y, Math.sin(t * 3) * 0.02, 0.1);
                smoothReset(headGroup, -0.05, 0, -0.08 + Math.sin(t * 4) * 0.04);

                smoothReset(leftArm.shoulderPivot, -0.2, 0, -0.1);
                smoothReset(leftArm.elbowPivot, -1.1, 0, 0);

                smoothReset(rightArm.shoulderPivot, 0, 0, 2.3);
                rightArm.elbowPivot.rotation.z = Math.sin(t * 8) * 0.35;
                rightArm.elbowPivot.rotation.x = THREE.MathUtils.lerp(rightArm.elbowPivot.rotation.x, -0.3, 0.1);

                smoothReset(leftLeg.hipPivot, 0, 0, 0);
                smoothReset(leftLeg.kneePivot, 0, 0, 0);
                smoothReset(rightLeg.hipPivot, 0, 0, 0);
                smoothReset(rightLeg.kneePivot, 0, 0, 0);

            } else if (currentAnim === 'walk') {
                const speed = 12;
                const swing = Math.sin(t * speed);

                doctor.position.y = Math.abs(Math.cos(t * speed)) * 0.05;
                smoothReset(headGroup, Math.abs(swing) * 0.03, 0, 0);

                leftLeg.hipPivot.rotation.x = swing * 0.6;
                rightLeg.hipPivot.rotation.x = -swing * 0.6;

                leftLeg.kneePivot.rotation.x = Math.max(0, -swing) * 0.8;
                rightLeg.kneePivot.rotation.x = Math.max(0, swing) * 0.8;

                smoothReset(rightArm.shoulderPivot, swing * 0.5, 0, 0.1);
                smoothReset(rightArm.elbowPivot, -0.3 - Math.max(0, swing) * 0.3, 0, 0);

                smoothReset(leftArm.shoulderPivot, -0.2 - swing * 0.1, 0, -0.1);
                smoothReset(leftArm.elbowPivot, -1.1, 0, 0);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
